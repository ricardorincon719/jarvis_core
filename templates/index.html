<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PEARL HOME</title>
    <link rel="icon" href="/static/favicon.ico?v=4">
    <link rel="apple-touch-icon" href="/static/icon-192.png"> 
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>

    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <div class="app-layer">
        <audio id="audioGranted" preload="auto">
            <source src="/static/audio/acceso_ok.mp3" type="audio/mpeg">
        </audio>
        <audio id="audioDenied" preload="auto">
            <source src="/static/audio/acceso_denegado.mp3" type="audio/mpeg">
        </audio>
        <audio id="audioWelcome" preload="auto">
            <source src="/static/audio/bienvenida.mp3" type="audio/mpeg">
        </audio>

        {% include 'components/auth.html' %}

        <!-- MAIN -->
        <div class="main-interface" id="mainInterface">
            {% include 'components/header.html' %}

            <div class="content-shell">
                {% include 'components/lights.html' %}

                {% include 'components/music.html' %}

                {% include 'components/network.html' %}

                {% include 'components/console.html' %}
            </div>

            {% include 'components/bottom_nav.html' %}
        </div>
    </div>

    <script>window.PEARL_CONFIG = {};</script>
    <script src="{{ url_for('static', filename='js/core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/status.js') }}"></script>
    <script src="{{ url_for('static', filename='js/network.js') }}"></script>
    <script src="{{ url_for('static', filename='js/music.js') }}"></script>
    <script src="{{ url_for('static', filename='js/devices.js') }}"></script>
    <script src="{{ url_for('static', filename='js/console.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lights.js') }}"></script>
    <script src="{{ url_for('static', filename='js/asserts.js') }}"></script>
</body>
</html>
